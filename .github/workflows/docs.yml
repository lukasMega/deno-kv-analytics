name: docs

# Builds website/ (Docusaurus) and publishes it to GitHub Pages. Separate from
# ci.yml on purpose: that job is Deno-only and must not grow a Node toolchain.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer commit cancel an in-flight deploy, but never interrupt one that is
# already writing to Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # onBrokenLinks: 'throw' — a dead link fails the build here, not silently
      # in production.
      # Repo-level variables, not environment ones: the `github-pages`
      # environment is only attached to the deploy job, so its variables are
      # invisible here — and attaching it to this job would make PR builds fail
      # its branch protection. Unset just omits the beacon.
      - run: npm run build
        env:
          COLLECTOR_ORIGIN: ${{ vars.COLLECTOR_ORIGIN }}
          COLLECTOR_SITE_ID: ${{ vars.COLLECTOR_SITE_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    # PRs build but do not publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
