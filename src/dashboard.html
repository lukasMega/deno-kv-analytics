<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docs-analytics</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <div class="head">
    <h1>docs-analytics</h1>
    <span class="links"><a href="/help">help &amp; setup</a></span>
  </div>

  <section>
    <div class="toolbar">
      <input id="token" value="devtoken" placeholder="token" autocomplete="off">
      <input id="site" list="siteList" placeholder="site id" autocomplete="off">
      <datalist id="siteList"></datalist>
      <input id="day" type="date" title="single day — overrides the period buttons">
      <button id="load" class="alt">Load</button>
    </div>
    <div class="periods" id="periods">
      <button data-period="today">Today</button>
      <button data-period="7d">Last 7 days</button>
      <button data-period="14d">Last 14 days</button>
      <button data-period="30d">Last 30 days</button>
      <button data-period="thisMonth">This month</button>
      <button data-period="lastMonth">Last month</button>
      <button data-period="thisYear">This year</button>
      <button data-period="lastYear">Last year</button>
      <button data-period="all">All time</button>
    </div>
    <label class="toggle" for="showBots">
      <input type="checkbox" id="showBots"> bots
    </label>
    <div class="msg" id="loadMsg"></div>

    <div id="analytics" style="display:none">
      <div class="kpiRow">
        <div class="kpiTile">
          <div class="kpiVal" id="kpiPv">0</div>
          <div class="kpiLabel">pageviews</div>
          <div class="kpiDelta" id="kpiPvDelta"></div>
        </div>
        <div class="kpiTile">
          <div class="kpiVal" id="kpiUv">0</div>
          <div class="kpiLabel">unique visitors</div>
          <div class="kpiDelta" id="kpiUvDelta"></div>
        </div>
        <div class="kpiTile">
          <div class="kpiVal" id="kpiSessions">0</div>
          <div class="kpiLabel">sessions</div>
          <div class="kpiDelta" id="kpiSessionsDelta"></div>
        </div>
        <div class="kpiTile">
          <div class="kpiVal" id="kpiViewsPerVisit">0</div>
          <div class="kpiLabel">views / visit</div>
          <div class="kpiDelta" id="kpiViewsPerVisitDelta"></div>
        </div>
        <div class="kpiTile">
          <div class="kpiVal" id="kpiBounce">0%</div>
          <div class="kpiLabel">bounce rate</div>
          <div class="kpiDelta" id="kpiBounceDelta"></div>
        </div>
        <div class="kpiTile">
          <div class="kpiVal" id="kpiEngagement">0%</div>
          <div class="kpiLabel">engagement rate</div>
          <div class="kpiDelta" id="kpiEngagementDelta"></div>
        </div>
        <div class="kpiTile" title="Share of pageviews where the behavioral probe saw real (isTrusted) input. A low value across a whole range suggests automated traffic; a single pageview without interaction is just a bounce.">
          <div class="kpiVal" id="kpiHuman">0%</div>
          <div class="kpiLabel">human interaction</div>
          <div class="kpiDelta" id="kpiHumanDelta"></div>
        </div>
        <div class="kpiTile bot" id="kpiBotTile" style="display:none" title="Hits whose User-Agent matched isbot, plus untrusted-event (synthetic) verdicts. Counted separately — bot hits never write `pv`, so no other KPI on this row includes them.">
          <div class="kpiVal" id="kpiBot">0</div>
          <div class="kpiLabel">bot visits</div>
          <div class="kpiDelta" id="kpiBotDelta"></div>
        </div>
        <div class="rangeLabel" id="rangeLabel"></div>
      </div>
      <div id="chartWrap"><div id="chart"></div></div>
      <div id="heatmapWrap"></div>
      <input id="search" class="search" placeholder="Filter breakdowns…">
      <button id="exportCsv" class="alt" style="margin-top:2px">Export CSV</button>
      <div id="breakdowns"></div>
    </div>
  </section>

<script type="module" src="/dashboard.js"></script>
</body>
</html>
