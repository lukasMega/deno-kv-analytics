# mise tasks mirror .github/workflows/ci.yml so a local `mise run beforeCommit`
# fails for the same reasons CI does. Task bodies stay thin — the real
# definitions live in deno.json so `deno task` keeps working without mise.

[tools]
deno = "2"

[tasks.dev]
# The one task that does NOT just delegate: mise runs a real shell, so the
# env defaults can be overridden here — `deno task dev` hardcodes them because
# deno_task_shell cannot expand `${VAR:-default}`.
description = "Watch mode on :8123 (devtoken / demo:localhost:8123, all overridable)"
run = "PORT=${PORT:-8123} STATS_TOKEN=${STATS_TOKEN:-devtoken} SITES=${SITES:-demo:localhost:${PORT:-8123}} deno run -A --watch src/main.ts"

[tasks.start]
run = "deno task start"

[tasks.test]
description = "Run the test suite"
run = "deno task test"

[tasks.fmt]
description = "Format sources in place"
run = "deno fmt"

[tasks.lint]
description = "deno fmt --check + deno lint"
run = ["deno fmt --check", "deno lint"]

[tasks.check]
description = "Type-check every entrypoint (beacon included)"
run = "deno check src/main.ts src/sites.ts src/migrate.ts src/admin.ts src/client/beacon.ts"

[tasks.build-client]
description = "Build src/client/beacon.ts -> src/s.js"
run = "deno task build-client"

[tasks."check-beacon"]
# src/s.js is committed (Deploy has no build step), so it must match its source
# — otherwise the deployed beacon silently lags behind client/beacon.ts.
description = "Rebuild s.js, fail if it differs from the committed one, check size"
run = [
  "deno task build-client",
  "git diff --exit-code -- src/s.js",
  "deno task check-size",
]

[tasks.docs]
# The Docusaurus site in website/ is the one Node-toolchain corner of an
# otherwise Deno-only repo; npm comes from the system, not from [tools], so the
# docs tasks stay out of everyone else's way. Local dev never writes counters:
# the beacon skips localhost.
description = "Serve the docs site on :3000 (website/, Docusaurus)"
dir = "website"
run = "npm start"

[tasks."docs-build"]
description = "Production build of the docs site into website/build"
dir = "website"
run = ["npm ci", "npm run build"]

[tasks.beforeCommit]
description = "Everything CI runs, in CI order"
depends = ["lint", "check", "test", "check-beacon"]
